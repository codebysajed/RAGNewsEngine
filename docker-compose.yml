services:

  # ==========================================
  # Backend - FastAPI
  # ==========================================

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rag_news_backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}

    volumes:
      # News JSON + screenshots
      - ./storage:/app/storage

      # Persistent FAISS index
      - vector_store:/app/vector_store

      # Persistent Hugging Face models
      - huggingface_models:/app/models

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s


  # ==========================================
  # Frontend - Streamlit
  # ==========================================

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: rag_news_frontend

    ports:
      - "8501:8501"

    env_file:
      - .env

    environment:
      BACKEND_URL: http://backend:8000/ask

    volumes:
      # Screenshots / news data
      - ./storage:/app/storage

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped


# ==========================================
# Persistent Docker Volumes
# ==========================================

volumes:
  vector_store:
  huggingface_models: